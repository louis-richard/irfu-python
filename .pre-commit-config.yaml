repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-yaml
      - id: check-symlinks
      - id: check-merge-conflict
      - id: detect-private-key
      - id: requirements-txt-fixer
      - id: trailing-whitespace
      - id: pretty-format-json
        args:
          - --autofix
      - id: name-tests-test
        args:
          - --unittest
  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        name: isort (python)
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-black
        name: nbqa-black
        description: "Run 'black' on a Jupyter Notebook"
        entry: nbqa black
        language: python
        require_serial: true
        types: [ jupyter ]
        additional_dependencies: [ black ]
  - repo: https://github.com/pycqa/flake8
    rev: "7.4.1"
    hooks:
      - id: flake8
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # The whole package (pyproject.toml [tool.mypy]), with the typed
        # dependencies; the untyped ones are ignore_missing_imports. CI runs
        # it with all the dependencies (tests.yml, typing)
        entry: mypy
        language: python
        pass_filenames: false
        types: [python]
        additional_dependencies:
          - mypy
          - types-requests
          - numpy>=2.0
          - xarray
          - pandas
          - matplotlib
          - platformdirs
          - keyring
  - repo: https://github.com/PyCQA/pylint
    rev: v4.1.3
    hooks:
      - id: pylint
        args:
          - --rcfile
          - pyproject.toml
          - --disable
          - import-error
          - --output-format
          - colorized

