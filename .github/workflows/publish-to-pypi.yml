name: Upload Python Package

# Trusted publishing (PyPI: pyrfu → Publishing → GitHub: louis-richard /
# irfu-python / publish-to-pypi.yml / environment pypi): no API token.
on:
  release:
    types: [published]

jobs:
  build:
    name: Build, check and test the distributions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Check that the tag is the package version
      run: |
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
          echo "Tag ${GITHUB_REF_NAME} is not v${version} (pyproject.toml)"; exit 1
        fi
    - name: Build the wheel and the sdist
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check --strict dist/*
    - name: Test the wheel installed in a clean environment
      run: |
        python -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/python" -m pip install "$(ls dist/*.whl)[tests]"
        cd "$RUNNER_TEMP" && "$RUNNER_TEMP/venv/bin/python" -m pytest --pyargs pyrfu.tests -p no:cacheprovider
    - uses: actions/upload-artifact@v6
      with:
        name: dist
        path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyrfu/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v7
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
