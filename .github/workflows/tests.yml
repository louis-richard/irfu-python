name: CI

on:
  push:
    branches: [master, devel]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']
        os: [ macos-latest, windows-latest, ubuntu-latest ]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        # Release candidate until Python 3.15.0 final is out
        allow-prereleases: true
    - name: Install dependencies
      # The package with its test dependencies (pyproject.toml [tests]), so
      # that CI tests what users install
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[tests]" flake8
    - name: Lint with flake8
      run: |
        flake8 $(git ls-files '*.py')
    - name: Test with pytest
      # The coverage job below runs the test suite for this matrix entry
      if: ${{ !(matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest') }}
      run: |
        pytest
    - name: Test with pytest (coverage + long tests)
      if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
      run: |
        sudo apt update && sudo apt install -y texlive
        pytest --cov=pyrfu --cov-report=xml
    - name: Upload coverage reports to Codecov
      # Right after the coverage run, so it doesn't depend on the release check;
      # fail the job if the upload fails instead of silently passing
      if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        fail_ci_if_error: true
    - name: Check that release process is not broken
      if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TESTPYPI_API_TOKEN }}
      run: |
        pip install build wheel twine
        python -m build .
        twine check dist/*
        twine upload --repository testpypi --skip-existing dist/*

  wheel:
    # Build the wheel, install it in a clean environment and run the tests of
    # the installed package from outside the repository, as a user would:
    # catches files missing from the wheel and imports of the source tree
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Build the wheel and the sdist
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check --strict dist/*
    - name: Install the wheel in a clean environment
      run: |
        python -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/python" -m pip install "$(ls dist/*.whl)[tests]"
    - name: Run the tests of the installed package
      working-directory: ${{ runner.temp }}
      run: |
        "$RUNNER_TEMP/venv/bin/python" -m pytest --pyargs pyrfu.tests -p no:cacheprovider

  docs:
    # Build the documentation as Read the Docs does (.readthedocs.yaml), with
    # the warnings as errors so that broken docstrings fail CI
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        sudo apt update && sudo apt install -y pandoc
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r docs/requirements.txt
    - name: Build the documentation
      run: |
        sphinx-build -W --keep-going -b html docs docs/_build/html
