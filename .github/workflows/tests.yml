name: CI

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        os: [ macos-latest, windows-latest, ubuntu-latest ]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        pip install -r requirements.txt
        pip install keyrings.alt
    - name: Lint with flake8
      run: |
        flake8 $(git ls-files '*.py')
    - name: Test with pytest
      # The coverage job below runs the test suite for this matrix entry
      if: ${{ !(matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest') }}
      run: |
        pip install pytest ddt pytest-cov sphinx pandoc
        pip install -r docs/requirements.txt
        pip install keyrings.alt
        pytest
    - name: Test with pytest (coverage + long tests)
      if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
      run: |
        sudo apt update && sudo apt install -y texlive pandoc
        pip install pytest ddt pytest-cov sphinx pandoc
        pip install -r docs/requirements.txt
        pip install keyrings.alt
        pytest --cov=pyrfu --cov-report=xml
    - name: Upload coverage reports to Codecov
      # Right after the coverage run, so it doesn't depend on the release check;
      # fail the job if the upload fails instead of silently passing
      if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        fail_ci_if_error: true
    - name: Check that release process is not broken
      if: matrix.python-version == '3.14' && matrix.os == 'ubuntu-latest'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TESTPYPI_API_TOKEN }}
      run: |
        pip install build wheel twine
        python -m build .
        twine check dist/*
        twine upload --repository testpypi --skip-existing dist/*
